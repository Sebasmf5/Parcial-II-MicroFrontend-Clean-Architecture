<table class="table table-striped border">
	<thead>
		<tr>
			<th scope="col">Id</th>
			<th scope="col">Usuario</th>
			<th scope="col">Correo</th>
			<th scope="col">Proveedor</th>
			<th scope="col">IPv4</th>
			<th scope="col">Última conexión</th>
			<th scope="col">Detalle</th>
		</tr>
	</thead>
	<tbody>
		@for (user of users; track user) {
			<tr>
				<th scope="row">{{ user.id }}</th>
				<td>{{ user.username }}</td>
				<td>{{ user.email }}</td>
				<td>
					<dsb-badge-atom
						[text]="user.provider"
						[type]="providerMap[user.provider]" >
					</dsb-badge-atom>
				</td>
				<td>{{ user.ipv4 }}</td>
				<td>{{ user.lastLogin }}</td>
				<td>
					<dsb-button-atom
						[idButton]="'' + user.id"
						text="Ver"
						type="secondary"
						(clicker)="onSelect($event)" >
					</dsb-button-atom>
				</td>
			</tr>
		}
	</tbody>
</table>
