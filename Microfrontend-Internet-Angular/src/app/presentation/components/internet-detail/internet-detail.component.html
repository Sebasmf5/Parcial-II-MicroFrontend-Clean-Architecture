<div class="card mb-3">
	<div class="card-body">
		<h5 class="card-title">Usuario #{{ user.id }} — {{ user.username }}</h5>
		<p class="card-text mb-1"><strong>Correo:</strong> {{ user.email }}</p>
		<p class="card-text mb-1"><strong>Proveedor:</strong> {{ user.provider }}</p>
		<p class="card-text mb-1"><strong>IPv4:</strong> {{ user.ipv4 }}</p>
		<p class="card-text mb-1"><strong>Sitio web:</strong> {{ user.website }}</p>
		<p class="card-text"><strong>Última conexión:</strong> {{ user.lastLogin }}</p>
	</div>
</div>
